[package]
name = "mini-launcher"
version = "0.1.0"
edition = "2021"
default-run = "mini-launcher"
description = "A small, native Windows application launcher"
license = "GPL-3.0-or-later"

[workspace]
members = ["settings-gui", "installer"]
default-members = [".", "settings-gui", "installer"]
resolver = "2"

[[bin]]
name = "path-opener"
path = "plugins/path-opener/main.rs"

[[bin]]
name = "two-factor"
path = "plugins/two-factor/main.rs"

[[bin]]
name = "clipboard-history"
path = "plugins/clipboard-history/main.rs"

[[bin]]
name = "caffeine"
path = "plugins/caffeine/main.rs"

[[bin]]
name = "process-killer"
path = "plugins/process-killer/main.rs"

[[bin]]
name = "piin"
path = "plugins/piin/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
pinyin = "0.10"
png = "0.18"
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "UI_ViewManagement", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_UI_Accessibility", "Win32_System_Variant",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition",
    "Foundation_Numerics"
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Globalization",
    "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_IO",
    "Win32_System_Threading", "Win32_System_Time", "Win32_System_JobObjects", "Win32_System_Power", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Controls",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
