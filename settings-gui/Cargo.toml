[package]
name = "mini-launcher-config"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
mini-launcher = { path = ".." }
gpui-kit = "=0.9.0"
rfd = { version = "0.17", default-features = false }
toml = "0.9"
toml_edit = "0.25"
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

